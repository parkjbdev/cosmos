[build]
target = "aarch64-unknown-none-softfloat"

[target.'cfg(target_arch="aarch64")']
rustflags = [
    "-Crelocation-model=pic",
    "-Clink-arg=-pie",
    "-Clink-arg=-Tsrc/bsp/virt/kernel.ld",
    "-g",
    "-Copt-level=0"
]

[unstable]
build-std = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]
